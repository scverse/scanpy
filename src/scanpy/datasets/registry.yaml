# Datasets scanpy hosts itself, fetched via `scverse_misc.datasets.fetch`.
#
# Add a `sha256` for every file: it is what lets a truncated or corrupted
# download be detected (and retried) instead of surfacing as a parse error.
#
# `fallback_urls` are the upstream locations we used before our own S3 bucket
# (see #4011); they are used if the bucket is down or serves garbage.
